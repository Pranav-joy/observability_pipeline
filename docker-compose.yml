services:

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - observability-network

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    environment:
      - APP_ENV=${APP_ENV}
      - EXCLUDED_URLS=${EXCLUDED_URLS}
      - BAGGAGE_FIELDS=${BAGGAGE_FIELDS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - MONGO_URL=${MONGO_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
    networks:
      - observability-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - mongodb
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "8889:8889"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    environment:
      - TEMPO_ENDPOINT=${TEMPO_ENDPOINT}
      - LOKI_OTLP_ENDPOINT=${LOKI_OTLP_ENDPOINT}
    networks:
      - observability-network
    depends_on:
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - observability-network


  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - observability-network

  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/tempo-config.yaml
      - tempo-data:/var/tempo
    networks:
      - observability-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - observability-network
    depends_on:
      - loki

  loadgen:
    build: .
    networks:
      - observability-network
    environment:
      - API_URL=${API_URL}
    command: python loadgen.py
    depends_on:
      - api


volumes:
  mongo-data:
  tempo-data:
  prometheus-data:

networks:
  observability-network:
    driver: bridge
